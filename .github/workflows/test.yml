name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
            py: python3
          # macOS ships Python 3.9 as /usr/bin/python3, and GUI agent apps may launch the MCP server with it
          - os: macos-latest
            python: system
            py: /usr/bin/python3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        if: matrix.python != 'system'
        with: { python-version: "${{ matrix.python }}" }
      - run: ${{ matrix.py }} --version
      - run: npm ci --no-audit --no-fund && npm run build
        working-directory: web
      - run: ${{ matrix.py }} packaging/gen.py --check   # generated manifests, web versions, THIRD_PARTY_NOTICES.md (against node_modules)
      - run: ${{ matrix.py }} tests/test_server.py
      - run: ${{ matrix.py }} -m unittest discover -s tests -q
      - run: npm test
        env: { CERA_TEST_PYTHON: "${{ matrix.py }}" }
        working-directory: web
